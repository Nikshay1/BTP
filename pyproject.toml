[project]
name = "bioalloc"
version = "0.1.0"
description = "Adaptive allocation of subtasks to heterogeneous bio-inspired coordination mechanisms for LLM agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "Nikshay Yadav" },
    { name = "Madan Raj Murugesan" },
    { name = "Aryan Varshney" },
]
dependencies = [
    "pydantic>=2.9",
    "networkx>=3.3",
    "jsonschema>=4.23",
    "httpx>=0.27",
]

[project.scripts]
bioalloc = "bioalloc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-jsonschema>=4.26.0.20261006",
]
prep = [
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bioalloc"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
